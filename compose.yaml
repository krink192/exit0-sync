# exit0-sync: the exit 0 web app plus progress sync, on http://<host>:8080
#   docker compose up -d
#   docker compose exec exit0-sync exit0-sync user add jacob
# From a clone, to run your own build instead of the published image:
#   docker build -t ghcr.io/krink192/exit0-sync:latest . && docker compose up -d
services:
  exit0-sync:
    image: ghcr.io/krink192/exit0-sync:latest
    container_name: exit0-sync
    ports:
      - "8080:8080"
    volumes:
      - exit0-data:/data
    environment:
      EXIT0_SIGNUP: "false"        # "true" lets anyone who can reach the server create an account
      EXIT0_TRUST_PROXY: "true"    # behind Cloudflare Tunnel / a reverse proxy: rate-limit by the real client IP
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  exit0-data:

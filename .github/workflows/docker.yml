# Builds the container, checks that it serves the app and that sign-in and sync work,
# then on a version tag (v*) or a release publishes ghcr.io/krink192/exit0-sync for linux/amd64 and linux/arm64.
name: Container image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to ghcr.io as :latest and :v<package.json version>"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/exit0-sync

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: exit0-sync:test

      - name: Start the container
        run: |
          docker image ls
          if ! docker run -d --name exit0sync -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL exit0-sync:test 2> err.txt; then
            echo "::error title=docker run::$(tr '\n' ' ' < err.txt) | images: $(docker image ls --format '{{.Repository}}:{{.Tag}}' | tr '\n' ' ')"
            exit 1
          fi

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' exit0sync)" = healthy ] && exit 0
            sleep 1
          done
          exit 1

      - name: Serves the app; sign-in, sync and backup work
        run: |
          set -x
          curl -fsS http://127.0.0.1:8080/ | grep -qi "exit 0"
          curl -fsS http://127.0.0.1:8080/js/sync.js | grep -q createSync   # the bundled app must have sync
          echo "ci-password-123" | docker exec -i exit0sync exit0-sync user add ci
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-123","device":"CI"}' http://127.0.0.1:8080/v1/login | jq -r .token)
          DEV=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/v1/me | jq -r .device.id)
          curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"epoch":1,"base":0,"doc":{"v":3}}' "http://127.0.0.1:8080/v1/packs/le010/replicas/$DEV"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/v1/packs/le010 | jq -e '.replicas | length == 1'
          docker exec exit0sync exit0-sync backup /data/ci-backup.db

      - name: Show container state and logs (on failure)
        if: failure()
        run: |
          docker ps -a
          { docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' exit0sync; docker logs exit0sync; } > diag.txt 2>&1 || true
          cat diag.txt
          # also as an annotation so it shows up in the run summary
          echo "::error title=container diagnostics::$(sed -e 's/%/%25/g' diag.txt | tail -40 | sed -e ':a;N;$!ba;s/\n/%0A/g')"

      - name: Decide whether to publish, and the version tag
        id: ver
        env:
          # Pass workflow input via env so it is not interpolated into the shell script.
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$INPUT_PUBLISH" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT";
          else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GitHub Container Registry
        if: steps.ver.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 + arm64)
        if: steps.ver.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
